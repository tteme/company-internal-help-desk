services:
  db:
    image: postgres:16
    container_name: digaf-helpdesk-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: digaf-helpdesk-backend:latest
    container_name: digaf-helpdesk-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 5000
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FRONTEND_URL: ${FRONTEND_URL}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}

    ports:
      - "5001:5000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: digaf-helpdesk-frontend:latest
    container_name: digaf-helpdesk-frontend
    restart: unless-stopped

    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5001/api

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data: